name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint deps
        run: pip install pyyaml

      - name: Compile all Python
        run: python -m compileall -q guardrails tests

      - name: Check shim JS syntax
        run: |
          for f in shim/*.js; do node --check "$f"; done

      - name: Validate YAML configs
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
                  print("ok:", f)
              except Exception as e:
                  print("FAIL:", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  unit-tests:
    name: Detector unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned to the deployed proxy version so the guardrail's litellm imports
      # (CustomGuardrail / UserAPIKeyAuth / GuardrailEventHooks) resolve exactly
      # as in production.
      - name: Install deps
        run: pip install "litellm[proxy]==1.83.14" pyyaml

      # Mirror the in-container layout the test expects (sys.path -> /tmp/rc).
      - name: Run detector unit tests (33 cases)
        run: |
          mkdir -p /tmp/rc
          cp guardrails/br_dlp_guardrail.py /tmp/rc/
          cp tests/test_detectors.py /tmp/rc/
          python /tmp/rc/test_detectors.py
