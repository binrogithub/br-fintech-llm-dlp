# Presidio 葡语增强层。与主 compose 叠加使用：
#   cd /root/LiteLLM
#   docker compose -f docker-compose.yml -f /root/risk-control/presidio/docker-compose.presidio.yml up -d
#
# analyzer 用本地构建的 presidio-analyzer-pt 镜像（含 pt_core_news_md 模型，
# 构建：docker build -t presidio-analyzer-pt -f Dockerfile.analyzer-pt /root/risk-control/presidio）。
# PRESIDIO_*_API_BASE 已写入 /root/LiteLLM/.env，litellm 单独重启也不会丢。
services:
  presidio-analyzer:
    image: presidio-analyzer-pt:latest
    container_name: presidio_analyzer
    restart: unless-stopped
    ports:
      - "5002:3000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio_anonymizer
    restart: unless-stopped
    ports:
      - "5001:3000"

  litellm:
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_started
